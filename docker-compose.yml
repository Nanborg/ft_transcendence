name: ft_transcendence

services:
  frontend:
    image: nginx:1.27-alpine
    container_name: ft_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - app_net

  backend:
    image: node:20-alpine
    container_name: ft_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: npm run dev
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcendence:transcendence_dev_only@database:5432/transcendence}
      OAUTH42_CLIENT_ID: ${OAUTH42_CLIENT_ID:-replace_me}
      OAUTH42_CLIENT_SECRET: ${OAUTH42_CLIENT_SECRET:-replace_me}
      SESSION_SECRET: ${SESSION_SECRET:-replace_me}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
      gameplay-cpp:
        condition: service_started
    networks:
      - app_net

  database:
    image: postgres:16-alpine
    container_name: ft_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  gameplay-cpp:
    image: gcc:14
    container_name: ft_gameplay_cpp
    working_dir: /app
    command: ["bash", "-lc", "echo 'gameplay-cpp skeleton ready' && sleep infinity"]
    ports:
      - "${GAMEPLAY_PORT:-7000}:7000"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
