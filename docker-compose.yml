name: ft_transcendence

services:
  frontend:
    build:
      context: ./frontend
    container_name: ft_frontend
    expose:
      - "5173"
    networks:
      - app_net

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    container_name: ft_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - engine_map_payloads:/shared/game_maps
    command: sh -c "npm install && npm run prisma"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      GAME_MAP_DIRECTORY: ${GAME_MAP_DIRECTORY:-/shared/game_maps}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcendence:transcendence_dev_only@database:5432/transcendence}
      OAUTH42_CLIENT_ID: ${OAUTH42_CLIENT_ID:-replace_me_a}
      OAUTH42_CLIENT_SECRET: ${OAUTH42_CLIENT_SECRET:-replace_me_b}
      SESSION_SECRET: ${SESSION_SECRET:-replace_me_c}
      ACCESS_SECRET_TOKEN: ${ACCESS_SECRET_TOKEN}
      REFRESH_SECRET_TOKEN: ${REFRESH_SECRET_TOKEN}
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
        #Neon-05
      gameplay-cpp:
        condition: service_started
    networks:
      - app_net

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: ft_reverse_proxy
    ports:
      - "4242:4242"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: ft_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  gameplay-cpp:
    build:
      context: ./game_engine
    container_name: ft_gameplay_cpp
    ports:
# TODO(nanborg): Add a gameplay-cpp healthcheck and switch backend depends_on
#to service_healthy.
      - "${GAMEPLAY_PORT:-7297}:7297/udp"
    volumes:
      - engine_map_payloads:/shared/game_maps:ro
    networks:
      - app_net

volumes:
  postgres_data:
  engine_map_payloads:

networks:
  app_net:
    driver: bridge
