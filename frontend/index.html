<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Socket.IO Skeleton</title>
</head>
<body>
    <h1>Socket.IO connection skeleton</h1>
    <p>Open two browser tabs and check backend logs.</p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            path: "/socket.io",
            transports: ["websocket"]
        });

        socket.on("connect", () => {
            console.log("socket connected:", socket.id);
        });

        socket.on("disconnect", () => {
            console.log("socket disconnected");
        });
    </script>
</body>
</html>
